language: "en"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  auto_review:
    enabled: true
    drafts: false
    # Review is opt-out, never opt-in. A PR with no label still gets reviewed.
    # Opt-in by label would mean an unlabelled PR silently gets no review while
    # its status check still reports green, which is worse than no check at all.
    labels:
      - "!skip-review"
    # Dependabot PRs are already covered by Dependabot itself, CodeQL and CI.
    # Excluding them keeps review quota for changes that need human judgement.
    ignore_usernames:
      - "dependabot[bot]"
    ignore_title_keywords:
      - "WIP"
      - "DO NOT MERGE"
    # Do not re-run a full review on every push. Without this, a PR that takes
    # several rounds of fixes burns one review per push and exhausts the rate
    # limit. Request a re-review with `@coderabbitai review` when ready.
    auto_incremental_review: false
  path_instructions:
    - path: "internal/**"
      instructions: >
        This is the core of the FARO public audit log: append-only,
        Merkle-tree-based, built on Tessera. Flag anything that could break
        append-only guarantees, allow retroactive modification of already
        published entries, or weaken verification of inclusion and consistency
        proofs. Pay particular attention to checkpoint and signed-tree-head
        handling, correctness of tree hash computation, and race conditions in
        entry sequencing. Treat any change here as high risk.
    - path: "cmd/**"
      instructions: >
        FARO entry points and CLI. Check input validation, error handling that
        does not hide verification failures, and that no code path allows
        publishing an unsigned checkpoint or accepting an invalid proof as
        valid.
    - path: "web/**"
      instructions: >
        This is the public audit frontend for FARO, where anyone can verify
        inclusion and consistency proofs for themselves. Flag any place where a
        proof is displayed as valid without actually being verified client
        side, where verification failures are swallowed or rendered
        indistinguishably from success, or where log responses are trusted
        rather than checked. A convincing but unverified "verified" badge is
        worse than showing nothing, because the whole point of this interface
        is that users do not have to trust us.
    - path: ".github/**"
      instructions: >
        CI/CD and governance configuration. Flag workflow permissions broader
        than necessary, mutable references to third-party actions (floating
        tags or `@master` instead of a pinned tag or SHA), and any exposure of
        secrets in logs or in workflows that run on fork pull requests.
chat:
  auto_reply: true
