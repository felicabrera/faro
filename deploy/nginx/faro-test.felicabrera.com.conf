# FARO (development branch): faro-test.felicabrera.com
# / proxies to the faro-web-test container (10.10.10.20:28093), the static
# audit explorer; /api/ proxies to the faro-log-test container
# (10.10.10.20:28091), the transparency log.
# TLS: felicabrera.com wildcard certificate.
#
# This file is the source of truth: the deploy workflow copies it to the
# host, installs it at /etc/nginx/sites-available/faro-test.felicabrera.com.conf,
# symlinks it into sites-enabled, runs `nginx -t`, and reloads nginx only when
# that passes. Change the vhost here, not on the host.

server {
    listen 80;
    listen [::]:80;
    server_name faro-test.felicabrera.com;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name faro-test.felicabrera.com;

    modsecurity on;
    modsecurity_rules_file /etc/nginx/modsec/main.conf;

    ssl_certificate     /etc/nginx/ssl/felicabrera/STAR.felicabrera.com.pem;
    ssl_certificate_key /etc/nginx/ssl/felicabrera/STAR.felicabrera.com.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    "nosniff" always;
    add_header X-Frame-Options           "DENY" always;
    add_header Referrer-Policy           "no-referrer" always;

    location /api/ {
        proxy_pass         http://10.10.10.20:28091/;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
        proxy_send_timeout    30s;

        client_max_body_size 2m;

        # The log is read-only from the internet. POST /add has no write
        # authentication yet, so it must only be reachable from agora-api on
        # the internal network. GET also admits HEAD; every other method,
        # including POST, is refused here before it reaches faro-log.
        limit_except GET {
            deny all;
        }
    }

    location = /api/health {
        proxy_pass       http://10.10.10.20:28091/health;
        access_log       off;
        proxy_set_header Host $host;
    }

    location / {
        proxy_pass         http://10.10.10.20:28093;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    server_tokens off;

    access_log /var/log/nginx/faro-test.felicabrera.com.access.log;
    error_log  /var/log/nginx/faro-test.felicabrera.com.error.log warn;
}
