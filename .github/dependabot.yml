# Dependabot — actualizaciones de versión.
#
# Las actualizaciones *de seguridad* no se configuran acá: ya están habilitadas
# a nivel de repositorio (Dependabot alerts + automated security fixes) y se
# disparan solas cuando aparece un advisory que afecta al proyecto.
#
# Hoy el repositorio solo contiene workflows de GitHub Actions, así que ese es
# el único ecosistema activo. Declarar `gomod` sin un `go.mod` presente hace
# que Dependabot falle en cada corrida. Descomentar el bloque correspondiente
# cuando el código aterrice.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels: ["dependencies", "ci"]
    commit-message:
      prefix: "chore(ci)"

