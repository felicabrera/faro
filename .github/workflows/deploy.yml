name: Deploy

# Ships faro-log and the audit explorer (web/) to the VPS: development to
# faro-test.felicabrera.com, main to faro.felicabrera.com. Each branch
# deploys through its own GitHub Environment (test / production), which is
# where the per-environment secrets live (image/container names, host ports,
# the checkpoint signing key, the CORS origin, and the explorer's build-time
# API URL) — nothing environment specific is hardcoded here.
#
# The deploy key and remote path are repo-level secrets: one SSH identity per
# repo, restricted on the host to this repo's own directory tree
# (/opt/pfg/faro), so a compromised key cannot reach agora's containers.
#
# Secrets are only ever read into env: at the step that needs them, never
# interpolated straight into a run: script, so a secret value can't be
# reinterpreted as shell syntax.
on:
  push:
    branches: [development, main]

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up deploy SSH key
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > ~/.ssh/known_hosts

      - name: Sync source to the host
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key -p $DEPLOY_SSH_PORT -o UserKnownHostsFile=~/.ssh/known_hosts" \
            --exclude '.git' --exclude 'web/node_modules' --exclude 'web/.next' --exclude 'web/out' \
            ./ "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$REMOTE_PATH/release/"

      - name: Build and start the containers
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          IMAGE_NAME_LOG: ${{ secrets.IMAGE_NAME_LOG }}
          CONTAINER_NAME_LOG: ${{ secrets.CONTAINER_NAME_LOG }}
          HOST_PORT_LOG: ${{ secrets.HOST_PORT_LOG }}
          IMAGE_NAME_WEB: ${{ secrets.IMAGE_NAME_WEB }}
          CONTAINER_NAME_WEB: ${{ secrets.CONTAINER_NAME_WEB }}
          HOST_PORT_WEB: ${{ secrets.HOST_PORT_WEB }}
          FARO_SIGNING_KEY: ${{ secrets.FARO_SIGNING_KEY }}
          FARO_CORS_ORIGIN: ${{ secrets.FARO_CORS_ORIGIN }}
          NEXT_PUBLIC_FARO_URL: ${{ secrets.NEXT_PUBLIC_FARO_URL }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "IMAGE_NAME_LOG='$IMAGE_NAME_LOG' CONTAINER_NAME_LOG='$CONTAINER_NAME_LOG' HOST_PORT_LOG='$HOST_PORT_LOG' \
             IMAGE_NAME_WEB='$IMAGE_NAME_WEB' CONTAINER_NAME_WEB='$CONTAINER_NAME_WEB' HOST_PORT_WEB='$HOST_PORT_WEB' \
             FARO_SIGNING_KEY='$FARO_SIGNING_KEY' FARO_CORS_ORIGIN='$FARO_CORS_ORIGIN' NEXT_PUBLIC_FARO_URL='$NEXT_PUBLIC_FARO_URL' \
             docker compose -f '$REMOTE_PATH/release/docker-compose.yml' --project-directory '$REMOTE_PATH/release' -p '$PROJECT_NAME' up -d --build --remove-orphans"

      - name: Install the nginx vhost
        env:
          DEPLOY_SSH_HOST: ${{ secrets.DEPLOY_SSH_HOST }}
          DEPLOY_SSH_PORT: ${{ secrets.DEPLOY_SSH_PORT }}
          DEPLOY_SSH_USER: ${{ secrets.DEPLOY_SSH_USER }}
          REMOTE_PATH: ${{ secrets.REMOTE_PATH }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            main) domain="faro.felicabrera.com" ;;
            development) domain="faro-test.felicabrera.com" ;;
            *) echo "unexpected ref: $REF_NAME" >&2; exit 1 ;;
          esac
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
            "deploy/nginx/$domain.conf" "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST:$REMOTE_PATH/release/$domain.conf"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_SSH_PORT" -o UserKnownHostsFile=~/.ssh/known_hosts \
            "$DEPLOY_SSH_USER@$DEPLOY_SSH_HOST" \
            "sudo install -m 644 '$REMOTE_PATH/release/$domain.conf' '/etc/nginx/sites-available/$domain.conf' && \
             sudo ln -sf '/etc/nginx/sites-available/$domain.conf' '/etc/nginx/sites-enabled/$domain.conf' && \
             sudo nginx -t && sudo systemctl reload nginx"
