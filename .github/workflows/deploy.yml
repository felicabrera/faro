name: Deploy

# Ships faro-log and the audit explorer (web/) to the apps host: development to faro-test.felicabrera.com, main to
# faro.felicabrera.com. Each branch deploys through its own GitHub Environment
# (test / production), which holds the per-environment secrets (image/container names, host ports, the checkpoint signing key, the CORS origin and the explorer's build-time API URL).
#
# The job runs on a self-hosted runner on the apps host (label "faro",
# user faro-deploy, repo-scoped), so docker compose runs locally against
# /opt/pfg/faro/<test|prod>/release. nginx lives on the separate edge host:
# the vhost is staged there over SSH as faro-deploy, whose sudo is pinned to
# /usr/local/sbin/faro-sync-nginx. The key and host key are repo secrets.
#
# Secrets are only ever read into env: at the step that needs them, never
# interpolated straight into a run: script, so a secret value can't be
# reinterpreted as shell syntax.
on:
  push:
    branches: [development, main]

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

env:
  EDGE_HOST: 10.10.10.2

jobs:
  deploy:
    runs-on: [self-hosted, faro]
    timeout-minutes: 20
    environment: ${{ github.ref_name == 'main' && 'production' || 'test' }}
    env:
      RELEASE_DIR: /opt/pfg/faro/${{ github.ref_name == 'main' && 'prod' || 'test' }}/release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Sync source to the release directory
        run: |
          rsync -a --delete \
            --exclude '.git' --exclude 'web/node_modules' --exclude 'web/.next' --exclude 'web/out' \
            ./ "$RELEASE_DIR/"

      - name: Build and start the containers
        env:
          IMAGE_NAME_LOG: ${{ secrets.IMAGE_NAME_LOG }}
          CONTAINER_NAME_LOG: ${{ secrets.CONTAINER_NAME_LOG }}
          HOST_PORT_LOG: ${{ secrets.HOST_PORT_LOG }}
          IMAGE_NAME_WEB: ${{ secrets.IMAGE_NAME_WEB }}
          CONTAINER_NAME_WEB: ${{ secrets.CONTAINER_NAME_WEB }}
          HOST_PORT_WEB: ${{ secrets.HOST_PORT_WEB }}
          FARO_SIGNING_KEY: ${{ secrets.FARO_SIGNING_KEY }}
          FARO_CORS_ORIGIN: ${{ secrets.FARO_CORS_ORIGIN }}
          NEXT_PUBLIC_FARO_URL: ${{ secrets.NEXT_PUBLIC_FARO_URL }}
          PROJECT_NAME: ${{ secrets.PROJECT_NAME }}
        run: |
          # Written with umask 077 so the signing key is never readable by
          # other users on the host.
          (umask 077 && cat > "$RELEASE_DIR/.env" <<EOF
          HOST_BIND=10.10.10.20
          IMAGE_NAME_LOG=$IMAGE_NAME_LOG
          CONTAINER_NAME_LOG=$CONTAINER_NAME_LOG
          HOST_PORT_LOG=$HOST_PORT_LOG
          IMAGE_NAME_WEB=$IMAGE_NAME_WEB
          CONTAINER_NAME_WEB=$CONTAINER_NAME_WEB
          HOST_PORT_WEB=$HOST_PORT_WEB
          FARO_SIGNING_KEY=$FARO_SIGNING_KEY
          FARO_CORS_ORIGIN=$FARO_CORS_ORIGIN
          NEXT_PUBLIC_FARO_URL=$NEXT_PUBLIC_FARO_URL
          EOF
          )
          docker compose -f "$RELEASE_DIR/docker-compose.yml" --project-directory "$RELEASE_DIR" \
            --env-file "$RELEASE_DIR/.env" -p "$PROJECT_NAME" up -d --build --remove-orphans

      - name: Install the nginx vhost
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_HOST_KEY: ${{ secrets.DEPLOY_SSH_HOST_KEY }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          case "$REF_NAME" in
            main) domain="faro.felicabrera.com" ;;
            development) domain="faro-test.felicabrera.com" ;;
            *) echo "unexpected ref: $REF_NAME" >&2; exit 1 ;;
          esac
          key="$RUNNER_TEMP/edge_key"
          known="$RUNNER_TEMP/edge_known_hosts"
          trap 'rm -f "$key" "$known"' EXIT
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > "$key")
          printf '%s\n' "$DEPLOY_SSH_HOST_KEY" > "$known"
          ssh_opts=(-i "$key" -o UserKnownHostsFile="$known" -o BatchMode=yes -o IdentitiesOnly=yes)
          scp "${ssh_opts[@]}" "deploy/nginx/$domain.conf" "faro-deploy@$EDGE_HOST:$domain.conf.new"
          ssh "${ssh_opts[@]}" "faro-deploy@$EDGE_HOST" \
            "sudo -n /usr/local/sbin/faro-sync-nginx $domain; status=\$?; rm -f $domain.conf.new; exit \$status"
